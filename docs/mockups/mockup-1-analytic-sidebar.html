<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup 1 - 分析側欄地圖</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      --ink: #20252b;
      --muted: #69737f;
      --line: #d8dde3;
      --panel: #ffffff;
      --land: #d7e2d4;
      --water: #dbeaf0;
      --accent: #c63f2f;
      --teal: #167a7f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #eef2f4;
    }
    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 750;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .group {
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }
    .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .value { color: var(--muted); font-weight: 600; }
    .range {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e4e8ec 0 10%, var(--teal) 10% 82%, #e4e8ec 82%);
      position: relative;
    }
    .range::before,
    .range::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--teal);
      transform: translate(-50%, -50%);
    }
    .range::before { left: 10%; }
    .range::after { left: 82%; }
    .seg {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .seg button {
      border: 0;
      padding: 10px;
      background: #fff;
      font-weight: 650;
      color: var(--ink);
    }
    .seg button:first-child {
      background: #e7f2f2;
      color: #095d61;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
    }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .legend {
      display: grid;
      gap: 9px;
      font-size: 13px;
      color: var(--muted);
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 34px;
      height: 10px;
      border-radius: 99px;
      background: linear-gradient(90deg, #ffd36a, #e85a3f, #7b1e2c);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.2);
    }
    main {
      display: grid;
      grid-template-rows: 58px 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #f9fafb;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .map {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(0deg, rgba(255,255,255,.28) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px),
        var(--water);
      background-size: 44px 44px;
    }
    .taiwan {
      position: absolute;
      left: 44%;
      top: 14%;
      width: 190px;
      height: 520px;
      background: var(--land);
      border: 1px solid #a9bda9;
      border-radius: 48% 52% 45% 55% / 12% 18% 82% 88%;
      transform: rotate(18deg);
      box-shadow: 22px 10px 0 rgba(123, 150, 125, .16);
    }
    .coast-label {
      position: absolute;
      color: rgba(47,71,83,.48);
      font-size: 13px;
      font-weight: 700;
    }
    .label-n { left: 52%; top: 14%; }
    .label-e { left: 62%; top: 45%; }
    .label-s { left: 47%; bottom: 12%; }
    .heat, .quake {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .heat {
      background: radial-gradient(circle, rgba(219,46,38,.62), rgba(242,144,57,.34) 38%, rgba(255,216,92,.12) 70%, transparent 72%);
      mix-blend-mode: multiply;
    }
    .h1 { left: 54%; top: 34%; width: 180px; height: 180px; }
    .h2 { left: 49%; top: 59%; width: 240px; height: 240px; }
    .h3 { left: 57%; top: 73%; width: 140px; height: 140px; }
    .quake {
      width: 9px;
      height: 9px;
      background: #8f1f2d;
      border: 1px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .q1 { left: 51%; top: 24%; }
    .q2 { left: 56%; top: 35%; }
    .q3 { left: 50%; top: 48%; }
    .q4 { left: 46%; top: 62%; }
    .q5 { left: 57%; top: 68%; }
    .q6 { left: 52%; top: 78%; }
    .popup {
      position: absolute;
      right: 28px;
      top: 88px;
      width: 270px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.95);
      padding: 14px;
      box-shadow: 0 12px 28px rgba(33,42,53,.18);
    }
    .popup h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .popup dl {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 7px 8px;
      margin: 0;
      font-size: 13px;
    }
    .popup dt { color: var(--muted); }
    .popup dd { margin: 0; font-weight: 650; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <header>
        <h1>台灣地震熱區探索器</h1>
        <div class="sub">分析控制台版：把篩選、統計、圖例集中在固定側欄，地圖保持最大可讀面積。</div>
      </header>

      <section class="group">
        <div class="label">年份範圍 <span class="value">1995 - 2025</span></div>
        <div class="range" aria-hidden="true"></div>
      </section>

      <section class="group">
        <div class="label">規模範圍 <span class="value">M 3.0 - 7.3</span></div>
        <div class="range" aria-hidden="true"></div>
      </section>

      <section class="group">
        <div class="label">圖層</div>
        <div class="seg">
          <button>熱區</button>
          <button>點位</button>
        </div>
      </section>

      <section class="stats">
        <div class="stat"><b>16,365</b><span>目前篩選筆數</span></div>
        <div class="stat"><b>31</b><span>納入年份</span></div>
        <div class="stat"><b>7.3</b><span>最大規模</span></div>
        <div class="stat"><b>0</b><span>無效資料列</span></div>
      </section>

      <section class="group legend">
        <div class="legend-row"><span class="swatch"></span><span>發生次數熱區強度</span></div>
        <div class="legend-row"><span class="dot"></span><span>單筆地震點位</span></div>
      </section>
    </aside>

    <main>
      <div class="topbar">
        <span>Map view: Taiwan / deck.gl heatmap + point layer</span>
        <span>資料：1995-2025，含 2025 年 1-9 月</span>
      </div>
      <section class="map" aria-label="台灣地震熱區地圖示意">
        <div class="taiwan"></div>
        <span class="coast-label label-n">北部</span>
        <span class="coast-label label-e">東部海域</span>
        <span class="coast-label label-s">南部</span>
        <div class="heat h1"></div>
        <div class="heat h2"></div>
        <div class="heat h3"></div>
        <div class="quake q1"></div>
        <div class="quake q2"></div>
        <div class="quake q3"></div>
        <div class="quake q4"></div>
        <div class="quake q5"></div>
        <div class="quake q6"></div>
        <article class="popup">
          <h2>選取地震摘要</h2>
          <dl>
            <dt>時間</dt><dd>2024-12-30 03:51</dd>
            <dt>規模</dt><dd>M 5.2</dd>
            <dt>深度</dt><dd>15.1 km</dd>
            <dt>最大震度</dt><dd>4</dd>
            <dt>位置</dt><dd>嘉義縣政府東北東方</dd>
          </dl>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
